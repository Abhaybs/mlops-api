name: Build and Deploy FastAPI App to Azure WebApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3

      # Step 1: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 2: Build and push the image to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: abhaybs23/mlops:latest

      # Step 3: Deploy the Docker Hub image to Azure WebApp
      - name: Deploy to Azure WebApp (Docker Hub image)
        uses: azure/webapps-deploy@v2
        with:
          app-name: labmcazure
          # Make sure this matches your exact Azure app name
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          images: "abhaybs23/mlops:latest"
